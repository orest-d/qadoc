<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Questionnaire</title>
    <link rel="stylesheet" href="questionnaire.css">
    <link rel="stylesheet" href="https://unpkg.com/codemirror@5/lib/codemirror.css">
  </head>
  <body>
    <div class="q-shell">
      <header class="q-header">
        <nav class="q-menubar">
          <div class="q-menu" data-menu="file">
            <button type="button" class="q-menu-trigger">File</button>
            <div class="q-menu-dropdown">
              <label class="q-menu-item q-load-button">📂 Load CSV<input type="file" id="load-csv" accept=".csv,text/csv"></label>
              <label class="q-menu-item q-load-button" data-roles="reviewer editor">📂 Load JSON<input type="file" id="load-json" accept="application/json,.json"></label>
              <button type="button" class="q-menu-item" id="save-csv">💾 Save CSV</button>
              <button type="button" class="q-menu-item" id="save-json" data-roles="reviewer editor">💾 Save JSON</button>
              <button type="button" class="q-menu-item" id="save-html">💾 Save HTML</button>
            </div>
          </div>
          <div class="q-menu" data-menu="view" data-roles="reviewer editor">
            <button type="button" class="q-menu-trigger">View</button>
            <div class="q-menu-dropdown">
              <div class="q-menu-section" id="view-menu-modes"></div>
              <hr class="q-menu-separator">
              <label class="q-menu-item q-menu-checkbox"><input type="checkbox" id="show-normal-checkbox" checked> Normal questions</label>
              <label class="q-menu-item q-menu-checkbox"><input type="checkbox" id="show-reviewer-checkbox" checked> Reviewer questions</label>
              <label class="q-menu-item q-menu-checkbox"><input type="checkbox" id="show-hidden-checkbox"> Show hidden</label>
            </div>
          </div>
          <div class="q-menu" data-menu="help">
            <button type="button" class="q-menu-trigger">Help</button>
            <div class="q-menu-dropdown">
              <button type="button" class="q-menu-item" data-help-description>📖 Description</button>
              <button type="button" class="q-menu-item" data-help-about>ℹ️ About</button>
            </div>
          </div>
          <div class="q-menubar-right">
            <input type="search" id="global-search" class="q-global-search" placeholder="Search…" data-global-search>
            <select id="role-select"></select>
            <button type="button" class="q-menubar-save" id="save-html-shortcut">💾 Save</button>
          </div>
        </nav>
        <div class="q-title-card">
          <p class="q-kicker">Questionnaire</p>
          <h1 id="questionnaire-title">Questionnaire</h1>
          <p id="questionnaire-version" class="q-subtitle">Version 3.0</p>
        </div>
      </header>

      <nav id="category-nav"></nav>
      <div id="summary"></div>
      <main id="questions" class="q-questions"></main>
      <footer class="q-footer">
        <button type="button" id="prev-category">Previous</button>
        <button type="button" id="next-category">Next</button>
      </footer>
      <section id="editor"></section>
    </div>

    <template id="question-card-template">
      <section class="q-card" data-question-id="{{id}}">
        <div class="q-card-head">
          <h3 class="q-prompt">{{question}}</h3>
          {{#required}}<span class="q-required">*</span>{{/required}}
          {{#subcategory}}<span class="q-subcategory">{{subcategory}}</span>{{/subcategory}}
          {{#_editor}}<button type="button" class="q-edit-btn" data-edit-question="{{id}}">✏️ Edit</button>{{/_editor}}
        </div>
        {{#help}}<p class="q-help">{{help}}</p>{{/help}}
        {{#_analysis_visible}}<p class="q-analysis">{{analysis}}</p>{{/_analysis_visible}}
        <div class="q-answer-block" data-question-control></div>
        <div data-review-control></div>
        <div data-reviewer-comment-control></div>
        {{#_errors}}<p class="q-error">{{.}}</p>{{/_errors}}
      </section>
    </template>

    <template id="reviewer-question-card-template">
      <section class="q-card{{#_highlight_reviewer}} q-reviewer-card{{/_highlight_reviewer}}" data-question-id="{{id}}">
        <div class="q-card-head q-reviewer-head">
          <h3 class="q-prompt">{{question}}</h3>
          <span class="q-meta-pill q-status-{{review_status}}">{{_status_label}}</span>
          <div data-review-control></div>
          {{#_editor}}<button type="button" class="q-edit-btn" data-edit-question="{{id}}">✏️ Edit</button>{{/_editor}}
        </div>
        {{#analysis}}<p class="q-analysis">{{analysis}}</p>{{/analysis}}
        {{#help}}<p class="q-help">{{help}}</p>{{/help}}
        <div data-reviewer-comment-control></div>
        {{#_errors}}<p class="q-error">{{.}}</p>{{/_errors}}
      </section>
    </template>

    <template id="question-editor-template">
      <form class="q-editor-form" data-question-editor>
        <fieldset class="q-editor-section">
          <legend>Identity</legend>
          <div data-editor-field="id"></div>
          <div data-editor-field="category"></div>
          <div data-editor-field="subcategory"></div>
          <div data-editor-field="type"></div>
        </fieldset>
        <fieldset class="q-editor-section">
          <legend>Content</legend>
          <div data-editor-field="question"></div>
          <div data-editor-field="help"></div>
        </fieldset>
        <fieldset class="q-editor-section">
          <legend>Behavior</legend>
          <div data-editor-field="required"></div>
          <div data-editor-field="default"></div>
          <div data-editor-field="rows"></div>
          <div data-editor-field="options"></div>
        </fieldset>
        <fieldset class="q-editor-section">
          <legend>Visibility</legend>
          <div data-editor-field="visible_if_id"></div>
          <div data-editor-field="visible_if_value"></div>
        </fieldset>
        <fieldset class="q-editor-section">
          <legend>Review</legend>
          <div data-editor-field="weight"></div>
          <div data-editor-field="analysis"></div>
        </fieldset>
        <fieldset class="q-editor-section">
          <legend>State</legend>
          <div data-editor-field="answer"></div>
          <div data-editor-field="review_status"></div>
          <div data-editor-field="reviewer_comment"></div>
        </fieldset>
      </form>
    </template>

    <script src="https://unpkg.com/mustache@latest/mustache.min.js"></script>
    <script src="https://unpkg.com/codemirror@5/lib/codemirror.js"></script>
    <script src="https://unpkg.com/codemirror@5/mode/xml/xml.js"></script>
    <script src="https://unpkg.com/codemirror@5/mode/javascript/javascript.js"></script>
    <script src="https://unpkg.com/codemirror@5/mode/css/css.js"></script>
    <script src="https://unpkg.com/codemirror@5/mode/htmlmixed/htmlmixed.js"></script>
    <script src="questionnaire_v3.js"></script>

    <script id="questionnaire-v3-data" type="application/json"></script>
    <script id="questionnaire-v3-templates" type="application/json"></script>

    <script id="questionnaire-v3-script">
      const dataElement = document.getElementById("questionnaire-v3-data");
      const embeddedData = dataElement && dataElement.textContent.trim()
        ? JSON.parse(dataElement.textContent)
        : null;

      const templatesElement = document.getElementById("questionnaire-v3-templates");
      const embeddedTemplates = templatesElement && templatesElement.textContent.trim()
        ? JSON.parse(templatesElement.textContent)
        : {};

      const app = QuestionnaireV3.create({
        config: embeddedData?.config || { id: "questionnaire", title: "Questionnaire", version: "3.0" },
        questions: embeddedData?.questions || [],
        role: "interviewed",
        roleLabels: { interviewed: "Interviewed", reviewer: "Reviewer", editor: "Editor" },
        containers: {
          questions: document.getElementById("questions"),
          categoryNav: document.getElementById("category-nav"),
          editor: document.getElementById("editor"),
          summary: document.getElementById("summary"),
          header: document.querySelector("header.q-header"),
          footer: document.querySelector("footer.q-footer")
        },
        templates: {
          questionCard: document.getElementById("question-card-template"),
          reviewerQuestionCard: document.getElementById("reviewer-question-card-template"),
          editorForm: document.getElementById("question-editor-template")
        },
        templateOverrides: embeddedTemplates,
        onChangeBody: '// Add questionnaire-specific rules here.\n'
      });
      window.questionnaireV3App = app;
    </script>
  </body>
</html>
