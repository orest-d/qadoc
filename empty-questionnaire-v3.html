<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Questionnaire</title>
    <style>
:root {
  --q-bg: #fcfcfc;
  --q-ink: #1d2440;
  --q-header-bg: rgba(0, 0, 94, 0.85);
  --q-header-text: #ffffff;
  --q-accent-soft: #fbd9ca;
  --q-border: rgba(0, 0, 94, 0.12);
  --q-shadow: 0 12px 30px rgba(0, 0, 40, 0.08);
  --q-danger: #a63f2f;
  --q-status-pending: #111827;
  --q-status-satisfactory: #23784a;
  --q-status-partial: #7a6200;
  --q-status-unsatisfactory: #b33a30;
  --q-rule-bg: #eaf4ff;
  --q-rule-border: #b7d9f6;
  --q-tab-html: #e0edff;
  --q-tab-css: #fbe8d5;
  --q-tab-js: #fef3c7;
  --q-tab-json: #e0f2e9;
  --q-tab-html-active: #bdd7f5;
  --q-tab-css-active: #f5d0a9;
  --q-tab-js-active: #fde68a;
  --q-tab-json-active: #b6e2c8;
  --q-tabular-group-review-bg: #f3eef8;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--q-bg);
  color: var(--q-ink);
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

button,
input,
select,
textarea {
  font: inherit;
}

.q-shell {
  max-width: 1040px;
  margin: 0 auto;
  padding: 24px;
}

.q-header {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.q-title-card {
  background: var(--q-header-bg);
  color: var(--q-header-text);
  border-radius: 18px;
  padding: 20px 28px;
  box-shadow: var(--q-shadow);
}

.q-title-card h1, .q-title-card p { margin: 0; }

.q-header h1,
.q-header p {
  margin: 0;
}

.q-kicker,
.q-subtitle,
.q-page-count {
  opacity: 0.84;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-size: 0.78rem;
}

.q-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: end;
}

.q-toolbar label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 0.85rem;
}

.q-toolbar-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  align-items: end;
}

.q-toolbar button,
.q-footer button,
.q-page-tab,
.q-toolbar select,
.q-toolbar input {
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.26);
  padding: 6px 10px;
}

.q-toolbar button,
.q-footer button,
.q-page-tab {
  background: #ffffff;
  color: var(--q-ink);
  cursor: pointer;
}

.q-toolbar-action,
.q-load-button.q-toolbar-action {
  min-height: 32px;
  display: inline-flex;
  flex-direction: row;
  gap: 0;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.26);
  background: #ffffff;
  color: var(--q-ink);
  padding: 6px 10px;
  font-size: 0.85rem;
  line-height: 1.2;
}

.q-load-button {
  position: relative;
  overflow: hidden;
  cursor: pointer;
}

.q-load-button input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}

.q-page-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 22px 0 0;
}

.q-flash {
  margin-top: 18px;
  border-radius: 14px;
  padding: 14px 16px;
  border: 1px solid var(--q-border);
  background: #ffffff;
  box-shadow: var(--q-shadow);
}

.q-flash-success {
  background: var(--q-accent-soft);
}

.q-flash-error {
  background: #fff1ef;
  color: var(--q-danger);
}

.q-page-tab {
  border: 1px solid var(--q-border);
  background: #ffffff;
}

.q-page-tab.is-current {
  background: var(--q-accent-soft);
}

.q-main {
  margin-top: 22px;
}

.q-page-intro {
  background: #ffffff;
  border: 1px solid var(--q-border);
  border-radius: 16px;
  padding: 20px 22px;
  box-shadow: var(--q-shadow);
}

.q-page-intro h2,
.q-page-description {
  margin: 0;
}

.q-page-intro h2 {
  margin-top: 6px;
}

.q-page-description {
  margin-top: 8px;
}

.q-questions {
  display: grid;
  gap: 18px;
  margin-top: 18px;
}

.q-card {
  background: #ffffff;
  border: 1px solid var(--q-border);
  border-radius: 16px;
  padding: 20px 22px;
  box-shadow: var(--q-shadow);
}

.q-card.is-reviewer-question {
  background: var(--q-accent-soft);
}

.q-card-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: start;
}

.q-prompt {
  margin: 0;
  font-size: 1.08rem;
}

.q-required {
  white-space: nowrap;
  background: var(--q-accent-soft);
  border-radius: 999px;
  padding: 5px 10px;
  font-size: 0.8rem;
}

.q-help {
  margin: 10px 0 0;
  color: rgba(29, 36, 64, 0.72);
}

.q-meta-pill {
  white-space: nowrap;
  border: 1px solid var(--q-border);
  border-radius: 999px;
  background: var(--q-bg);
  padding: 5px 10px;
  font-size: 0.8rem;
  font-weight: 650;
  text-transform: capitalize;
}

.q-reviewer-meta {
  margin: 12px 0 0;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.q-reviewer-meta div {
  border: 1px solid var(--q-border);
  border-radius: 10px;
  background: var(--q-bg);
  padding: 7px 9px;
}

.q-reviewer-meta dt,
.q-reviewer-meta dd {
  margin: 0;
}

.q-reviewer-meta dt {
  color: rgba(29, 36, 64, 0.62);
  font-size: 0.72rem;
  text-transform: uppercase;
}

.q-reviewer-meta dd {
  margin-top: 2px;
  font-size: 0.9rem;
  font-weight: 650;
}

.q-answer-block {
  margin-top: 14px;
  display: grid;
  gap: 12px;
}

.q-choice {
  display: flex;
  gap: 10px;
  align-items: center;
}

.q-fieldset {
  border: 0;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 10px;
}

.q-subfield,
.q-review-field {
  display: grid;
  gap: 6px;
}

.q-subfield input,
.q-subfield select,
.q-subfield textarea,
.q-review-field select,
.q-review-field textarea {
  width: 100%;
  border: 1px solid var(--q-border);
  border-radius: 10px;
  background: var(--q-bg);
  padding: 11px 12px;
  color: var(--q-ink);
}

textarea {
  min-height: 110px;
  resize: vertical;
}

.q-review-panel {
  margin: 0;
  padding: 0;
  border: none;
  background: transparent;
  display: grid;
  gap: 4px;
}

.q-review-panel.is-rule-applied {
  background: transparent;
  border-color: transparent;
}

.q-review-field span {
  font-size: 0.82rem;
  color: rgba(29, 36, 64, 0.6);
}

.q-review-status {
  font-weight: 650;
}

.q-review-field select.q-review-status-pending {
  color: var(--q-status-pending);
}

.q-review-field select.q-review-status-satisfactory {
  color: var(--q-rag-green);
}

.q-review-field select.q-review-status-partial {
  color: var(--q-rag-amber);
}

.q-review-field select.q-review-status-unsatisfactory {
  color: var(--q-rag-red);
}

.q-review-status option {
  color: var(--q-ink);
}

.q-reviewer-card .q-review-field select {
  background: #ffffff;
  border-radius: 8px;
  padding: 6px 8px;
  font-size: 0.88rem;
}

.q-reviewer-card .q-review-field span {
  font-size: 0.78rem;
}

.q-error {
  color: var(--q-danger);
  margin: 10px 0 0;
  font-weight: 600;
}

.q-footer {
  margin-top: 20px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.q-footer button {
  border: 1px solid var(--q-border);
  padding: 12px 18px;
}

.q-info,
.q-html {
  margin: 0;
  border: 1px solid var(--q-border);
  border-radius: 10px;
  background: var(--q-bg);
  padding: 12px;
}

.q-info {
  white-space: pre-wrap;
  overflow: auto;
}

.q-editor-toolbar {
  margin-top: 18px;
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 12px;
  flex-wrap: wrap;
}

.q-editor-toolbar button,
.q-editor-actions button {
  border: 1px solid var(--q-border);
  border-radius: 10px;
  background: #ffffff;
  color: var(--q-ink);
  cursor: pointer;
  padding: 10px 14px;
}

.q-editor-search {
  display: grid;
  gap: 6px;
  min-width: min(320px, 100%);
  font-size: 0.92rem;
}

.q-editor-search input {
  width: 100%;
  border: 1px solid var(--q-border);
  border-radius: 10px;
  background: #ffffff;
  color: var(--q-ink);
  padding: 10px 12px;
}

.q-editor-card {
  margin-top: 18px;
}

.q-editor-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.q-editor-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 16px;
}

.q-editor-field {
  display: grid;
  gap: 6px;
  font-size: 0.92rem;
}

.q-editor-field.is-wide {
  grid-column: 1 / -1;
}

.q-editor-field input,
.q-editor-field select,
.q-editor-field textarea {
  width: 100%;
  border: 1px solid var(--q-border);
  border-radius: 10px;
  background: var(--q-bg);
  color: var(--q-ink);
  padding: 10px 12px;
}

.q-editor-field textarea {
  min-height: 0;
}

.q-editor-field-textarea.is-wide textarea {
  min-height: 4.8em;
}

.q-editor-field-json_textarea.is-wide textarea {
  min-height: 150px;
}

.q-editor-advanced-toggle {
  margin-top: 14px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-weight: 650;
}

.q-editor-advanced-grid {
  margin-top: 12px;
}

.q-options-editor {
  display: grid;
  gap: 10px;
}

.q-options-editor table {
  width: 100%;
  border-collapse: collapse;
  background: #ffffff;
  border: 1px solid var(--q-border);
  border-radius: 10px;
  overflow: hidden;
}

.q-options-editor th,
.q-options-editor td {
  border-bottom: 1px solid var(--q-border);
  padding: 8px;
  text-align: left;
  vertical-align: middle;
}

.q-options-editor tr:last-child td {
  border-bottom: 0;
}

.q-options-editor input[type="text"] {
  min-width: 110px;
}

.q-option-other {
  text-align: center;
}

.q-option-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.q-options-editor button,
.q-option-actions button {
  border: 1px solid var(--q-border);
  border-radius: 8px;
  background: #ffffff;
  color: var(--q-ink);
  cursor: pointer;
  padding: 7px 10px;
}

.q-editor-form fieldset {
  border: 1px solid var(--q-border);
  border-radius: 12px;
  margin: 0 0 14px;
  padding: 14px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.q-editor-form legend {
  padding: 0 6px;
  font-weight: 650;
}

.q-editor-section[hidden] {
  display: none;
}

.q-editor-slot.is-wide {
  grid-column: 1 / -1;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid rgba(0, 0, 94, 0.32);
  outline-offset: 2px;
}

@media (max-width: 760px) {
  .q-shell {
    padding: 14px;
  }

  .q-header {
    padding: 20px;
    flex-direction: column;
  }

  .q-footer {
    flex-direction: column;
  }

  .q-editor-grid {
    grid-template-columns: 1fr;
  }

  .q-editor-form fieldset {
    grid-template-columns: 1fr;
  }
}

/* ===========================================================================
   Questionnaire V3 additions
   =========================================================================== */

:root {
  --q-reviewer-comment-color: #1d4ed8;
  --q-reviewer-comment-bg: #eff4ff;
  --q-rag-green: #23784a;
  --q-rag-amber: #7a6200;
  --q-rag-red: #b33a30;
  --q-rag-neutral: #6b7280;
  --q-tabular-group-question-bg: #eaf2fb;
  --q-tabular-group-ui-bg: #fdf6e3;
  --q-tabular-group-optional-bg: #ecf7ee;
}

/* The hidden attribute must win over component display rules
   (e.g. .q-toolbar-action sets display:inline-flex). */
[hidden] {
  display: none !important;
}

/* --- category navigation (reuses page-tab styling) --- */
.q-category-tab {
  border-radius: 10px;
  border: 1px solid var(--q-border);
  background: #ffffff;
  color: var(--q-ink);
  cursor: pointer;
  padding: 10px 14px;
}

.q-category-tab.is-current {
  background: var(--q-accent-soft);
}

#category-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 22px 0 0;
}

/* --- question card extras --- */
.q-subcategory {
  white-space: nowrap;
  border: 1px solid var(--q-border);
  border-radius: 999px;
  background: var(--q-bg);
  padding: 4px 10px;
  font-size: 0.78rem;
  color: rgba(29, 36, 64, 0.7);
}

.q-analysis {
  margin: 10px 0 0;
  padding: 10px 12px;
  border-left: 3px solid var(--q-border);
  background: var(--q-bg);
  border-radius: 0 8px 8px 0;
  font-size: 0.92rem;
}

/* Review-type question cards are highlighted for reviewers/editors. */
.q-reviewer-card {
  background: var(--q-accent-soft);
  border-color: rgba(0, 0, 94, 0.18);
}

.q-reviewer-comment {
  margin: 12px 0 0;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--q-reviewer-comment-color);
  background: var(--q-reviewer-comment-bg);
  color: var(--q-reviewer-comment-color);
}

.q-edit-btn {
  border: 1px solid var(--q-border);
  border-radius: 10px;
  background: #ffffff;
  color: var(--q-ink);
  cursor: pointer;
  padding: 6px 10px;
  font-size: 0.85rem;
  white-space: nowrap;
}

.q-empty {
  color: rgba(29, 36, 64, 0.6);
  padding: 20px;
}

.q-highlight {
  outline: 3px solid var(--q-accent-soft);
  outline-offset: 3px;
  transition: outline-color 0.4s ease;
}

/* --- yes/no controls --- */
.q-yesno {
  flex-direction: row;
  gap: 18px;
}

.q-yesno-text {
  margin-top: 10px;
}

/* --- review controls --- */
.q-review-panel {
  margin: 0;
  padding: 0;
  border: none;
  background: transparent;
  display: grid;
  gap: 4px;
}

.q-review-field span {
  font-size: 0.82rem;
  color: rgba(29, 36, 64, 0.6);
}

.q-reviewer-card .q-review-field select {
  background: #ffffff;
  border-radius: 8px;
  padding: 6px 8px;
  font-size: 0.88rem;
}

.q-reviewer-card .q-review-field span {
  font-size: 0.78rem;
}

.q-comment-field {
  margin-top: 12px;
  display: grid;
  gap: 6px;
}

.q-comment-field textarea,
.q-review-field select,
.q-review-field textarea {
  width: 100%;
  border: 1px solid var(--q-border);
  border-radius: 10px;
  background: var(--q-bg);
  color: var(--q-ink);
  padding: 10px 12px;
}

/* --- status colors (pills & summary counts) --- */
.q-status-pending { color: var(--q-status-pending); }
.q-status-satisfactory { color: var(--q-rag-green); }
.q-status-partial { color: var(--q-rag-amber); }
.q-status-unsatisfactory { color: var(--q-rag-red); }

select.q-review-status { font-weight: 650; }
select.q-review-status option { color: var(--q-ink); }

/* --- reviewer summary panel --- */
.q-summary-panel {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin: 16px 0 0;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid var(--q-border);
  background: #ffffff;
  box-shadow: var(--q-shadow);
}

.q-summary-block {
  flex: 1 1 240px;
  border: 1px solid var(--q-border);
  border-radius: 12px;
  padding: 12px 14px;
  background: var(--q-bg);
}

.q-summary-label {
  font-weight: 700;
  text-transform: capitalize;
  margin-bottom: 6px;
}

.q-summary-counts {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 0.85rem;
}

.q-summary-score {
  margin-top: 8px;
  font-size: 1.1rem;
  font-weight: 700;
}

.q-summary-block.q-rag-green { border-left: 6px solid var(--q-rag-green); }
.q-summary-block.q-rag-amber { border-left: 6px solid var(--q-rag-amber); }
.q-summary-block.q-rag-red { border-left: 6px solid var(--q-rag-red); }
.q-summary-block.q-rag-neutral { border-left: 6px solid var(--q-rag-neutral); }

.q-summary-block.q-rag-green .q-summary-score { color: var(--q-rag-green); }
.q-summary-block.q-rag-amber .q-summary-score { color: var(--q-rag-amber); }
.q-summary-block.q-rag-red .q-summary-score { color: var(--q-rag-red); }

/* Editor uses the full viewport width to show as much of the table/form as
   possible. Add the `is-fullwidth` class to the shell while in the editor role. */
.q-shell.is-fullwidth {
  max-width: none;
}

/* --- tabular view --- */
.q-tabular {
  margin-top: 6px;
}

.q-tabular-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.q-tabular-add {
  border: 1px solid var(--q-border);
  border-radius: 10px;
  background: #ffffff;
  color: var(--q-ink);
  cursor: pointer;
  padding: 10px 14px;
}

.q-tabular-scroll {
  border: 1px solid var(--q-border);
  border-radius: 12px;
}

.q-tabular-table {
  border-collapse: collapse;
  width: max-content;
  min-width: 100%;
  font-size: 0.78rem;
}

.q-tabular-table th,
.q-tabular-table td {
  border: 1px solid var(--q-border);
  padding: 1px 2px;
  text-align: left;
  vertical-align: top;
}

.q-tabular-table thead th {
  position: sticky;
  top: 0;
  background: #ffffff;
  z-index: 2;
}

.q-tabular-groups th {
  text-align: center;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

/* Cell backgrounds are transparent; inputs carry the group colour */
.q-tabular-group-question,
.q-tabular-group-ui,
.q-tabular-group-review,
.q-tabular-group-optional { background: transparent; }

.q-tabular-groups th.q-tabular-group-question { background: var(--q-tabular-group-question-bg); }
.q-tabular-groups th.q-tabular-group-review { background: var(--q-tabular-group-review-bg); }
.q-tabular-groups th.q-tabular-group-ui { background: var(--q-tabular-group-ui-bg); }
.q-tabular-groups th.q-tabular-group-optional { background: var(--q-tabular-group-optional-bg); }

.q-tabular-table input,
.q-tabular-table select,
.q-tabular-table textarea {
  width: 100%;
  min-width: 60px;
  border: 1px solid var(--q-border);
  border-radius: 2px;
  background: transparent;
  color: var(--q-ink);
  padding: 1px 3px;
  font-size: 0.85rem;
}

td.q-tabular-group-question input,
td.q-tabular-group-question select,
td.q-tabular-group-question textarea,
td.q-tabular-group-question .q-tabular-readonly,
td.q-tabular-group-question .q-tabular-preview { background: var(--q-tabular-group-question-bg); }
td.q-tabular-group-review input,
td.q-tabular-group-review select,
td.q-tabular-group-review textarea,
td.q-tabular-group-review .q-tabular-readonly,
td.q-tabular-group-review .q-tabular-preview { background: var(--q-tabular-group-review-bg); }
td.q-tabular-group-ui input,
td.q-tabular-group-ui select,
td.q-tabular-group-ui textarea,
td.q-tabular-group-ui .q-tabular-readonly,
td.q-tabular-group-ui .q-tabular-preview { background: var(--q-tabular-group-ui-bg); }
td.q-tabular-group-optional input,
td.q-tabular-group-optional select,
td.q-tabular-group-optional textarea,
td.q-tabular-group-optional .q-tabular-readonly,
td.q-tabular-group-optional .q-tabular-preview { background: var(--q-tabular-group-optional-bg); }

/* Column widths */
.q-tabular-table input[data-tabular-field="question"],
.q-tabular-table textarea[data-tabular-field="question"] { min-width: 200px; }
.q-tabular-table input[data-tabular-field="rows"],
.q-tabular-table input[data-tabular-field="weight"] { min-width: 40px; }
.q-tabular-table input[data-tabular-field="required"] { min-width: 24px; }
.q-tabular-table textarea[data-tabular-field="default"] { min-width: 80px; }

.q-tabular-table textarea {
  min-height: 0;
  resize: vertical;
}

.q-tabular-controls {
  white-space: nowrap;
  position: sticky;
  left: 0;
  background: #ffffff;
  z-index: 1;
}

.q-tabular-controls-head {
  position: sticky;
  left: 0;
  background: #ffffff;
  z-index: 3;
}

.q-tabular-controls button {
  border: 1px solid var(--q-border);
  border-radius: 4px;
  background: #ffffff;
  cursor: pointer;
  padding: 1px 4px;
  margin: 0;
}

.q-tabular-readonly {
  color: rgba(29, 36, 64, 0.7);
}

.q-tabular-preview {
  font-style: italic;
  color: rgba(29, 36, 64, 0.6);
}

/* --- editor panel (slide-in drawer, always visible while open) --- */
.q-editor-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: min(40vw, 100%);
  min-width: 400px;
  height: 100vh;
  overflow: auto;
  z-index: 50;
  border-left: 1px solid var(--q-border);
  background: #ffffff;
  box-shadow: -12px 0 30px rgba(0, 0, 40, 0.18);
  padding: 18px 20px;
}

.q-editor-panel-head {
  position: sticky;
  top: -18px;
  background: #ffffff;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 4px 0 10px;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--q-border);
}

.q-editor-panel-head h3 {
  margin: 0;
}

.q-editor-close {
  border: 1px solid var(--q-border);
  border-radius: 10px;
  background: #ffffff;
  color: var(--q-ink);
  cursor: pointer;
  padding: 8px 12px;
}

/* --- template editor --- */
.q-template-editor {
  margin-top: 18px;
}

.q-template-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  margin-bottom: 0;
  border-bottom: 2px solid var(--q-border);
}

.q-template-tab {
  border: 1px solid var(--q-border);
  border-bottom: none;
  border-radius: 8px 8px 0 0;
  background: #ffffff;
  color: var(--q-ink);
  cursor: pointer;
  padding: 6px 14px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.82rem;
  position: relative;
  top: 2px;
}

.q-template-tab.is-current {
  font-weight: 600;
  border-bottom: 2px solid #ffffff;
}

.q-template-tab--html { background: var(--q-tab-html); }
.q-template-tab--css  { background: var(--q-tab-css); }
.q-template-tab--js   { background: var(--q-tab-js); }
.q-template-tab--json { background: var(--q-tab-json); }

.q-template-tab--html.is-current { background: var(--q-tab-html-active); border-bottom-color: var(--q-tab-html-active); }
.q-template-tab--css.is-current  { background: var(--q-tab-css-active); border-bottom-color: var(--q-tab-css-active); }
.q-template-tab--js.is-current   { background: var(--q-tab-js-active); border-bottom-color: var(--q-tab-js-active); }
.q-template-tab--json.is-current { background: var(--q-tab-json-active); border-bottom-color: var(--q-tab-json-active); }

.q-template-code {
  width: 100%;
  min-height: 420px;
  border: 1px solid var(--q-border);
  border-top: none;
  border-radius: 0 0 12px 12px;
  background: #ffffff;
  color: var(--q-ink);
  padding: 12px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.85rem;
  line-height: 1.5;
}

.q-template-editor .CodeMirror {
  border: 1px solid var(--q-border);
  border-top: none;
  border-radius: 0 0 12px 12px;
  height: auto;
  min-height: 420px;
}

.q-template-warning {
  background: var(--q-tab-js);
  border: 1px solid var(--q-border);
  border-top: none;
  padding: 8px 14px;
  font-size: 0.85rem;
  color: var(--q-ink);
}

/* §9 — compact reviewer card head */
.q-reviewer-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.q-reviewer-head .q-meta-pill {
  margin-left: auto;
}

/* §6 — comment balloon (Word-style right-margin annotation) */
.q-card {
  position: relative;
}

.q-comment-balloon {
  position: absolute;
  left: calc(100% + 12px);
  top: 0;
  width: max(220px, calc((100vw - 1040px) / 2 - 16px));
  background: #fff9e6;
  border: 1.5px solid #f0b429;
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 0.83rem;
  line-height: 1.4;
  color: #5a4a00;
  box-shadow: 0 2px 8px rgba(0,0,0,0.10);
  z-index: 5;
}

.q-comment-balloon::before {
  content: "";
  position: absolute;
  left: -10px;
  top: 10px;
  border: 5px solid transparent;
  border-right-color: #f0b429;
}

.q-comment-balloon-edit {
  background: #eaf4ff;
  border-color: #5b8dee;
  color: inherit;
}

.q-comment-balloon-edit::before {
  border-right-color: #5b8dee;
}

.q-comment-balloon-edit label {
  display: block;
}

.q-comment-balloon-edit textarea {
  width: 100%;
  min-height: 60px;
  resize: vertical;
  border: 1px solid var(--q-border);
  border-radius: 6px;
  padding: 4px 6px;
  font-size: 0.83rem;
}

@media (max-width: 900px) {
  .q-comment-balloon {
    position: static;
    width: auto;
    right: auto;
    margin-top: 10px;
  }

  .q-comment-balloon::before {
    display: none;
  }
}

/* §13 — display view */
.q-display {
  max-width: 760px;
  margin: 0 auto;
  padding: 24px 16px;
  line-height: 1.7;
}

.q-display-category {
  font-size: 1.25rem;
  font-weight: 600;
  margin: 32px 0 12px;
  padding-bottom: 6px;
  border-bottom: 2px solid var(--q-border);
  color: var(--q-ink);
}

.q-display-item,
.q-display-reviewer-item {
  margin: 12px 0;
  padding: 0;
}

.q-display-question {
  font-weight: 500;
  margin: 0 0 2px;
}

.q-display-reviewer-question {
  font-style: italic;
  color: rgba(29,36,64,0.7);
}

.q-display-answer {
  margin: 0;
  color: var(--q-ink);
}

.q-display-comment {
  margin: 2px 0 0;
  font-size: 0.88rem;
  color: var(--q-reviewer-comment-color);
}

.q-display-status {
  font-size: 0.85rem;
  font-weight: 600;
  margin: 0;
}

/* §16 — drag-and-drop classes */
.q-drag-source {
  opacity: 0.4;
}

.q-drag-over {
  outline: 2px solid var(--q-accent-soft);
}

.q-drag-handle {
  display: inline-block;
  padding: 3px 5px;
  margin: 1px;
  cursor: grab;
  color: rgba(29, 36, 64, 0.4);
  font-size: 1rem;
  line-height: 1;
  user-select: none;
  border-radius: 4px;
}

.q-drag-handle:hover {
  color: var(--q-ink);
  background: var(--q-accent-soft);
}

.q-drag-handle:active {
  cursor: grabbing;
}

/* §1 — tabular normal-view link */
.q-tabular-normalview {
  display: inline-block;
  padding: 3px 5px;
  margin: 1px;
  text-decoration: none;
  color: var(--q-ink);
  border: 1px solid var(--q-border);
  border-radius: 6px;
  background: #ffffff;
  font-size: 0.9rem;
}

.q-tabular-normalview:hover {
  background: var(--q-accent-soft);
}

/* §17 — sort-by-category button */
.q-tabular-sort {
  border: 1px solid var(--q-border);
  border-radius: 8px;
  background: #ffffff;
  color: var(--q-ink);
  cursor: pointer;
  padding: 8px 12px;
  font-size: 0.85rem;
  margin-left: 8px;
}

/* §4 — date today button */
.q-date-today {
  border: 1px solid var(--q-border);
  border-radius: 6px;
  background: #ffffff;
  color: var(--q-ink);
  cursor: pointer;
  padding: 4px 10px;
  font-size: 0.85rem;
  margin-left: 6px;
}

/* §2 — is_other companion */
.q-other-text {
  display: block;
  margin-top: 8px;
}

/* §5 — visibility checkboxes in toolbar (legacy) */
.q-toolbar-checkbox {
  flex-direction: row !important;
  align-items: center;
  gap: 6px;
  font-size: 0.88rem;
  align-self: center;
}

/* --- menu bar --- */
.q-menubar {
  display: flex;
  align-items: center;
  gap: 0;
  flex-wrap: wrap;
  background: var(--q-header-bg);
  color: var(--q-header-text);
  padding: 0 4px;
  font-size: 0.85rem;
  line-height: 1;
  border-radius: 10px;
  margin-bottom: 8px;
}
.q-menu { position: relative; }
.q-menu-trigger {
  background: transparent;
  border: none;
  color: inherit;
  padding: 3px 10px;
  cursor: pointer;
  font-size: 0.85rem;
  border-radius: 3px;
}
.q-menu-trigger:hover { background: rgba(255, 255, 255, 0.15); }
.q-menu-dropdown {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  min-width: 200px;
  background: #ffffff;
  color: var(--q-ink);
  border: 1px solid var(--q-border);
  border-radius: 6px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
  z-index: 100;
  padding: 4px 0;
}
.q-menu.is-open .q-menu-dropdown { display: block; }
.q-menu-item {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  border: none;
  padding: 6px 16px;
  cursor: pointer;
  font-size: 0.85rem;
  color: var(--q-ink);
}
.q-menu-item:hover { background: var(--q-accent-soft); }
.q-menu-checkbox { cursor: pointer; }
.q-menu-checkbox input[type="checkbox"] { margin-right: 8px; }
.q-menu-separator {
  border: none;
  border-top: 1px solid var(--q-border);
  margin: 4px 0;
}
.q-view-mode-btn.is-active {
  font-weight: 600;
  background: var(--q-accent-soft);
}
.q-menubar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 0;
}
.q-global-search {
  border-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  padding: 2px 8px;
  font-size: 0.82rem;
  background: rgba(255, 255, 255, 0.15);
  color: inherit;
  width: 160px;
}
.q-global-search::placeholder { color: rgba(255, 255, 255, 0.6); }
.q-menubar-save {
  background: rgba(255, 255, 255, 0.9);
  color: var(--q-ink);
  border: none;
  border-radius: 4px;
  padding: 2px 10px;
  cursor: pointer;
  font-size: 0.82rem;
}
.q-menubar .q-load-button input[type="file"] { display: none; }

/* --- modal --- */
.q-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
}
.q-modal {
  background: #ffffff;
  color: var(--q-ink);
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
  max-width: 540px;
  width: 90%;
  max-height: 80vh;
  overflow: auto;
}
.q-modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid var(--q-border);
}
.q-modal-head h2 { margin: 0; font-size: 1.1rem; }
.q-modal-close {
  background: transparent;
  border: none;
  font-size: 1.4rem;
  cursor: pointer;
  color: var(--q-ink);
}
.q-modal-body { padding: 16px 20px; }

/* --- hidden questions --- */
.q-hidden-revealed {
  opacity: 0.55;
  background: #f0f0f0 !important;
  border-left: 3px solid #999;
}
.q-display-hidden { color: #999; }
tr.q-hidden-revealed td { opacity: 0.6; }

    <div class="q-shell">

              <button type="button" class="q-menu-item" id="save-csv">💾 Save CSV</button>

              <button type="button" class="q-menu-item" id="save-html">💾 Save HTML</button>

              <button type="button" class="q-menu-item" data-help-about>ℹ️ About</button>

    <template id="question-card-template">

          <h3 class="q-prompt">{{question}}</h3>
          {{#required}}<span class="q-required">*</span>{{/required}}
          {{#subcategory}}<span class="q-subcategory">{{subcategory}}</span>{{/subcategory}}
          {{#_editor}}<button type="button" class="q-edit-btn" data-edit-question="{{id}}">✏️ Edit</button>{{/_editor}}
        </div>
        {{#help}}<p class="q-help">{{help}}</p>{{/help}}
        {{#_analysis_visible}}<p class="q-analysis">{{analysis}}</p>{{/_analysis_visible}}
        <div class="q-answer-block" data-question-control></div>
        <div data-review-control></div>
        <div data-reviewer-comment-control></div>
        {{#_errors}}<p class="q-error">{{.}}</p>{{/_errors}}
      </section>
    </template>

    <template id="reviewer-question-card-template">
      <section class="q-card{{#_highlight_reviewer}} q-reviewer-card{{/_highlight_reviewer}}" data-question-id="{{id}}">
        <div class="q-card-head q-reviewer-head">
          <h3 class="q-prompt">{{question}}</h3>
          <span class="q-meta-pill q-status-{{review_status}}">{{_status_label}}</span>
          <div data-review-control></div>

        </div>
        {{#analysis}}<p class="q-analysis">{{analysis}}</p>{{/analysis}}
        {{#help}}<p class="q-help">{{help}}</p>{{/help}}
        <div data-reviewer-comment-control></div>
        {{#_errors}}<p class="q-error">{{.}}</p>{{/_errors}}
      </section>
    </template>

    <template id="question-editor-template">
      <form class="q-editor-form" data-question-editor>
        <fieldset class="q-editor-section">
          <legend>Identity</legend>
          <div data-editor-field="id"></div>
          <div data-editor-field="category"></div>
          <div data-editor-field="subcategory"></div>
          <div data-editor-field="type"></div>
        </fieldset>
        <fieldset class="q-editor-section">
          <legend>Content</legend>
          <div data-editor-field="question"></div>
          <div data-editor-field="help"></div>
        </fieldset>
        <fieldset class="q-editor-section">
          <legend>Behavior</legend>
          <div data-editor-field="required"></div>
          <div data-editor-field="default"></div>
          <div data-editor-field="rows"></div>
          <div data-editor-field="options"></div>
        </fieldset>
        <fieldset class="q-editor-section">
          <legend>Visibility</legend>
          <div data-editor-field="visible_if_id"></div>
          <div data-editor-field="visible_if_value"></div>
        </fieldset>
        <fieldset class="q-editor-section">
          <legend>Review</legend>
          <div data-editor-field="weight"></div>
          <div data-editor-field="analysis"></div>
        </fieldset>
        <fieldset class="q-editor-section">
          <legend>State</legend>
          <div data-editor-field="answer"></div>
          <div data-editor-field="review_status"></div>
          <div data-editor-field="reviewer_comment"></div>
        </fieldset>
      </form>
    </template>

    var text = String(value).trim().toLowerCase();
    if (["1", "true", "t", "yes", "y", "on"].indexOf(text) !== -1) {
      return true;
    }
    if (["0", "false", "f", "no", "n", "off"].indexOf(text) !== -1) {
      return false;
    }
    return fallback;
  }

  function parseScalar(value) {
    if (typeof value !== "string") {
      return value;
    }
    var text = value.trim();
    if (text === "") {
      return "";
    }
    var lowered = text.toLowerCase();
    if (["true", "t", "yes", "y"].indexOf(lowered) !== -1) {
      return true;
    }
    if (["false", "f", "no", "n"].indexOf(lowered) !== -1) {
      return false;
    }
    if (lowered === "null") {
      return null;
    }
    return value;
  }

  function parseJsonField(value, fallback) {
    if (Array.isArray(value) || (value && typeof value === "object")) {
      return value;
    }
    if (typeof value !== "string" || !value.trim()) {
      return fallback;
    }
    try {
      return JSON.parse(value);
    } catch (error) {
      return fallback;
    }

  function normalizeKeys(value, aliases) {
    if (Array.isArray(value)) {
      return value.map(function (item) {
        return normalizeKeys(item, aliases);
      });
    }
    if (value && typeof value === "object") {
      var normalized = {};
      Object.keys(value).forEach(function (key) {
        normalized[aliases[key] || key] = normalizeKeys(value[key], aliases);
      });
      return normalized;
    }
    return value;
  }

  function optionValueToString(value) {
    if (value === null || typeof value === "undefined") {
      return "";
    }
    return String(value);
  }

  function displayValue(value) {
    if (value === null || typeof value === "undefined") {
      return "";
    }
    if (Array.isArray(value) || (value && typeof value === "object")) {
      return JSON.stringify(value);
    }
    return String(value);
  }

  function ciEquals(left, right) {
    return String(left === null || typeof left === "undefined" ? "" : left).trim().toLowerCase() ===
      String(right === null || typeof right === "undefined" ? "" : right).trim().toLowerCase();
  }

  function getTemplateHtml(template) {
    if (!template) {
      return "";
    }
    if (typeof template === "string") {
      return template;
    }
    if (typeof template.innerHTML === "string") {
      return template.innerHTML;
    }
    return "";
  }

  function fallbackMustache(template, data) {
    return template
      .replace(/\{\{#([a-zA-Z0-9_]+)\}\}([\s\S]*?)\{\{\/\1\}\}/g, function (_, key, content) {
        var value = data[key];
        if (Array.isArray(value)) {
          return value.map(function (item) {
            return fallbackMustache(content.replace(/\{\{\.\}\}/g, escapeHtml(item)), data);
          }).join("");
        }
        return value ? fallbackMustache(content, data) : "";
      })
      .replace(/\{\{([a-zA-Z0-9_]+)\}\}/g, function (_, key) {
        return escapeHtml(data[key]);
      });

  function renderTemplate(template, data) {
    if (W.Mustache && typeof W.Mustache.render === "function") {
      return W.Mustache.render(template, data);
    }
    return fallbackMustache(template, data);
  }

  // ---------------------------------------------------------------------------
  // CSV
  // ---------------------------------------------------------------------------

  function csvEscape(value) {
    var text = String(value === null || typeof value === "undefined" ? "" : value);
    if (/[",\n\r]/.test(text)) {
      return '"' + text.replace(/"/g, '""') + '"';
    }
    return text;
  }

  function firstCsvLine(text) {
    var inQuotes = false;
    var line = "";
    for (var i = 0; i < text.length; i += 1) {
      var ch = text[i];
      if (inQuotes) {
        if (ch === '"' && text[i + 1] === '"') {
          line += '""';
          i += 1;
        } else if (ch === '"') {
          inQuotes = false;
          line += ch;
        } else {
          line += ch;
        }
      } else if (ch === '"') {
        inQuotes = true;
        line += ch;
      } else if (ch === "\n" || ch === "\r") {
        break;
      } else {
        line += ch;
      }
    }
    return line;
  }

  function detectCsvDelimiter(text) {
    var line = firstCsvLine(text);
    var candidates = [",", ";", "|", "\t"];
    var counts = candidates.map(function (delimiter) {
      var count = 0;
      var inQuotes = false;
      for (var i = 0; i < line.length; i += 1) {
        var ch = line[i];
        if (inQuotes) {
          if (ch === '"' && line[i + 1] === '"') {
            i += 1;
          } else if (ch === '"') {
            inQuotes = false;
          }
        } else if (ch === '"') {
          inQuotes = true;
        } else if (ch === delimiter) {
          count += 1;
        }
      }
      return { delimiter: delimiter, count: count };
    });
    counts.sort(function (a, b) {
      return b.count - a.count;
    });
    return counts[0].count > 0 ? counts[0].delimiter : ",";
  }

  function parseCsv(text) {
    var delimiter = detectCsvDelimiter(text);
    var rows = [];
    var row = [];
    var cell = "";
    var inQuotes = false;
    for (var i = 0; i < text.length; i += 1) {
      var ch = text[i];
      if (inQuotes) {
        if (ch === '"' && text[i + 1] === '"') {
          cell += '"';
          i += 1;
        } else if (ch === '"') {
          inQuotes = false;
        } else {
          cell += ch;
        }
      } else if (ch === '"') {
        inQuotes = true;
      } else if (ch === delimiter) {
        row.push(cell);
        cell = "";
      } else if (ch === "\n") {
        row.push(cell);
        rows.push(row);
        row = [];
        cell = "";
      } else if (ch !== "\r") {
        cell += ch;
      }
    }
    if (cell || row.length) {
      row.push(cell);
      rows.push(row);
    }
    if (!rows.length) {
      return [];
    }
    var headers = rows.shift();
    return rows.filter(function (item) {
      return item.some(function (value) {
        return value !== "";
      });
    }).map(function (item) {
      var object = {};
      headers.forEach(function (header, index) {
        object[header] = item[index] || "";
      });
      return object;
    });
  }

  function stringifyCsv(rows, columns) {
    return [columns.map(csvEscape).join(",")].concat(rows.map(function (row) {
      return columns.map(function (column) {
        var value = row[column];
        if (Array.isArray(value) || (value && typeof value === "object")) {
          value = JSON.stringify(value);
        }
        return csvEscape(value);
      }).join(",");
    })).join("\n") + "\n";
  }

  // ---------------------------------------------------------------------------
  // Normalization
  // ---------------------------------------------------------------------------

  // Replaces dashes in a category with underscores, warning the host.
  function sanitizeCategory(value, warn) {
    var text = value === null || typeof value === "undefined" ? "" : String(value);
    if (text.indexOf("-") !== -1) {
      var replaced = text.replace(/-/g, "_");
      if (typeof warn === "function") {
        warn(text, replaced);
      }
      return replaced;
    }
    return text;
  }

  function normalizeQuestion(raw, index, warn) {
    var aliases = { visibleIf: "visible_if_value" };
    var optionAliases = { isOther: "is_other" };
    var question = {};
    Object.keys(raw || {}).forEach(function (key) {
      question[aliases[key] || key] = raw[key];
    });

    question.id = question.id ? String(question.id) : ("q_" + (index + 1));
    question.category = sanitizeCategory(question.category || "default", warn) || "default";
    if (typeof question.subcategory !== "undefined" && question.subcategory !== null) {
      question.subcategory = String(question.subcategory);
    }
    question.question = question.question === null || typeof question.question === "undefined"
      ? "" : String(question.question);
    question.help = question.help === null || typeof question.help === "undefined"
      ? "" : String(question.help);
    question.type = QUESTION_TYPES.indexOf(question.type) !== -1 ? question.type : (question.type || "text");
    question.required = parseBoolean(question.required, false);

    if (typeof question.rows !== "undefined" && question.rows !== null && question.rows !== "") {
      question.rows = Math.max(1, Number(question.rows) || 1);
    } else {
      delete question.rows;
    }

    question.options = normalizeKeys(parseJsonField(question.options, []), optionAliases);
    question.visible_if_id = question.visible_if_id ? String(question.visible_if_id) : "";
    question.visible_if_value = question.visible_if_value === null || typeof question.visible_if_value === "undefined"
      ? "" : String(question.visible_if_value);
    question.default = parseScalar(question.default);
    var rawAns = question.answer;
    if (rawAns === "" || typeof rawAns === "undefined") {
      question.answer = null;
    } else if (Array.isArray(rawAns) || (rawAns !== null && typeof rawAns === "object")) {
      question.answer = null;
    } else {
      question.answer = parseScalar(rawAns);
    }

    question.review_status = REVIEW_STATUSES.indexOf(question.review_status) !== -1
      ? question.review_status : "pending";
    question.reviewer_comment = question.reviewer_comment === null || typeof question.reviewer_comment === "undefined"
      ? "" : String(question.reviewer_comment);

    if (typeof question.weight !== "undefined" && question.weight !== null && question.weight !== "") {
      question.weight = Number(question.weight);
      if (!isFinite(question.weight)) {
        question.weight = 1;
      }
    } else {
      question.weight = 1;
    }

    if (typeof question.analysis !== "undefined" && question.analysis !== null) {
      question.analysis = String(question.analysis);
    }

    // weight_score is always recalculated and never trusted from input.
    delete question.weight_score;

    return question;
  }

  // ---------------------------------------------------------------------------
  // App
  // ---------------------------------------------------------------------------

  function QuestionnaireV3App(config) {

    this.containers = config.containers || {};
    this.editorFields = deepClone(config.questionFields || DEFAULT_EDITOR_FIELDS);

    this.roleLabels = Object.assign(
      { interviewed: "Interviewed", reviewer: "Reviewer", editor: "Editor" },
      config.roleLabels || {}
    );
    this.viewLabels = Object.assign(
      { normal: "Normal", tabular: "Tabular", overview: "Overview", template: "Source code", display: "Document" },
      config.viewLabels || {}
    );
    this.statusLabels = Object.assign(
      {
        pending: "Pending",
        satisfactory: "Satisfactory",
        partial: "Partial",
        unsatisfactory: "Unsatisfactory"
      },
      config.statusLabels || {}
    );
    this.totalLabel = config.totalLabel || "Total";

    if (config.ragThresholds === null) {
      this.ragThresholds = null;
    } else {
      this.ragThresholds = Object.assign({ green: 80, amber: 50 }, config.ragThresholds || {});
    }

    // Template sources: DOM template elements (from host) used as defaults,
    // overridden by string overrides edited in the template view.
    this.templates = config.templates || {};
    this.templateOverrides = Object.assign({}, config.templateOverrides || {});
    if (this.templateOverrides.css) {
      this._applyCssOverride(this.templateOverrides.css);
    }

    this.configOnChange = typeof config.onChange === "function" ? config.onChange : null;
    this.onChangeBody = typeof config.onChangeBody === "string" ? config.onChangeBody : "";
    this.compileOnChange();

    this.role = ROLES.indexOf(config.role) !== -1 ? config.role : "interviewed";
    this.view = config.view && this.viewAvailable(config.view, this.role)
      ? config.view : DEFAULT_VIEW[this.role];

    this.questions = [];
    this.currentCategory = "";
    this.editorSearch = "";
    this.editingId = null;
    this.selectedTemplateId = "question_card";
    this.validationErrors = {};
    this._suppressHash = false;
    this._codeMirror = null;
    this._pendingScrollY = null;
    this.showNormalQuestions = true;
    this.showReviewerQuestions = true;
    this.showHidden = false;
    var initVis = this._defaultVisibility();
    this.showNormalQuestions = initVis.showNormal;
    this.showReviewerQuestions = initVis.showReviewer;

    this.setQuestions(config.questions || [], { silent: true });

    this._captureInitialTemplates();

    if (config.useHash !== false) {
      this.bindHash();
      this.applyHash({ silent: true });
    }

    this.render();
  }

  var proto = QuestionnaireV3App.prototype;

  // Snapshot initial template content from the DOM before the first render()
  // overwrites it.  This makes the HTML file the single source of truth —
  // the JS FALLBACK_TEMPLATES are only used when the DOM provides nothing.
  proto._captureInitialTemplates = function () {
    this._initialTemplates = {};
    // Card templates from <template> elements
    var qc = getTemplateHtml(this.templates.questionCard);
    if (qc) { this._initialTemplates.question_card = qc; }
    var rc = getTemplateHtml(this.templates.reviewerQuestionCard);
    if (rc) { this._initialTemplates.reviewer_card = rc; }
    var ef = getTemplateHtml(this.templates.editorForm);
    if (ef) { this._initialTemplates.editor_form = ef; }
    // Header/footer from live container innerHTML (captured before renderHeader
    // replaces it).
    if (this.containers.header && this.containers.header.innerHTML.trim()) {
      this._initialTemplates.header = this.containers.header.innerHTML;
    }
    if (this.containers.footer && this.containers.footer.innerHTML.trim()) {
      this._initialTemplates.footer = this.containers.footer.innerHTML;
    }
  };

  proto.api = function () {
    return this;
  };

  // --- onChange -------------------------------------------------------------

  proto.compileOnChange = function () {
    if (this.onChangeBody && this.onChangeBody.trim()) {
      try {
        this.onChangeFn = new Function("event", "api", this.onChangeBody);
      } catch (error) {
        if (W.console) {
          W.console.error("Failed to compile onChange hook:", error);
        }
        this.onChangeFn = this.configOnChange;
      }
    } else {
      this.onChangeFn = this.configOnChange;
    }
  };

  proto.triggerChange = function (event, options) {
    if (options && options.silent) {

    }

        this.onChangeFn(Object.assign({ role: this.role, view: this.view }, event), this);
      } catch (error) {

  proto.warnCategoryDash = function (original, replaced) {

      W.alert(message);
    } else if (W.console) {
      W.console.warn(message);
    }
  };

  // --- data -----------------------------------------------------------------

  proto.getQuestions = function () {
    return deepClone(this.questions);

  proto.setQuestions = function (questions, options) {

    if (questions && questions.config) {
      this.config = Object.assign({}, this.config, questions.config);
    }
    this.questions = list.map(function (raw, index) {
      return normalizeQuestion(raw, index, function (a, b) { self.warnCategoryDash(a, b); });
    });
    this.recomputeScores();
    if (!this.currentCategory || this.getCategories().indexOf(this.currentCategory) === -1) {

  proto.getQuestion = function (id) {

  proto.updateQuestion = function (id, patch) {
    var question = this.getQuestion(id);

  proto.updateQuestionField = function (id, field, value, options) {
    var self = this;
    var question = this.getQuestion(id);
    if (!question) {

    }
    if (field === "id") {
      value = String(value || "").trim();
      if (!value || value.indexOf("-") !== -1) { return; }
      var duplicate = this.questions.some(function (q) {
        return q !== question && q.id === value;

      if (duplicate) { return; }
      var oldId = question.id;
      question.id = value;
      this.questions.forEach(function (q) {
        if (q.visible_if_id === oldId) { q.visible_if_id = value; }
      });
      if (this.editingId === oldId) { this.editingId = value; }

      this.triggerChange({ type: "question", question_id: value, field: field, value: value }, options);
      if (!options || !options.deferRender) { this.render(); }
      return;

    if (field === "category") {
      value = sanitizeCategory(value, function (a, b) { self.warnCategoryDash(a, b); }) || "default";

  };

  proto.addQuestion = function (question) {
    var self = this;

      Object.assign({ category: this.currentCategory || "default", type: "text" }, question || {}),
      this.questions.length,
      function (a, b) { self.warnCategoryDash(a, b); }

    this.triggerChange({ type: "add", question_id: normalized.id });

  };

    this.recomputeScores();
    this.triggerChange({ type: "delete", question_id: id });
    this.render();

  proto.moveQuestion = function (id, placement) {
    var index = this.indexOfQuestion(id);
    if (index < 0) {

    }
    var target = index;
    if (placement && placement.before) {
      target = this.indexOfQuestion(placement.before);
    } else if (placement && placement.after) {
      target = this.indexOfQuestion(placement.after) + 1;
    } else if (placement && typeof placement.to === "number") {

  proto.indexOfQuestion = function (id) {

    this.questions[index] = this.questions[next];
    this.questions[next] = tmp;

    this._pendingScrollY = W.scrollY || 0;
    this.render();

    if (!options || !options.silent) {

      }
    }

    if (!options || !options.silent) {

    var question = this.getQuestion(id);

      return;

    question.reviewer_comment = value;
    this.triggerChange({ type: "reviewer_comment", question_id: id, field: "reviewer_comment", value: value }, options);
    if (!options || !options.silent) {
      if (!options || !options.deferRender) {
        this.render();
      }
    }
  };

  proto.recomputeScores = function () {
    this.questions.forEach(function (question) {

      }

  };

  proto.computeScore = function (questions) {

    var totalWeight = 0;

      if (question.type !== "review") {
        return;

      reviewCount += 1;
      var status = REVIEW_STATUSES.indexOf(question.review_status) !== -1 ? question.review_status : "pending";
      counts[status] += 1;
      var weight = Number(question.weight) || 0;

      weightedScore += weight * (SCORE_FACTOR[status] || 0);
    });

      counts: counts,
      total: reviewCount,
      total_weight: totalWeight,
      score: score
    };

  proto.getScore = function () {
    var self = this;
    var current = this.questions.filter(function (question) {
      return question.category === self.currentCategory;
    });
    return {
      current_category: this.computeScore(current),
      total: this.computeScore(this.questions)
    };
  };

  proto.ragClass = function (score) {
    if (this.ragThresholds === null) {
      return null;
    }
    if (score === null || typeof score === "undefined") {
      return "neutral";
    }
    if (score >= this.ragThresholds.green) {
      return "green";
    }
    if (score >= this.ragThresholds.amber) {
      return "amber";
    }
    return "red";
  };

  // --- categories -----------------------------------------------------------

  proto.getCategories = function () {
    var seen = {};
    var ordered = [];
    this.questions.forEach(function (question) {
      var category = question.category || "default";
      if (!seen[category]) {
        seen[category] = true;
        ordered.push(category);
      }
    });
    return ordered;
  };

  proto.getCurrentCategory = function () {
    var categories = this.getCategories();
    if (categories.indexOf(this.currentCategory) === -1) {
      this.currentCategory = categories[0] || "default";
    }
    return this.currentCategory;
  };

  proto.setCategory = function (category, options) {
    if (this.getCategories().indexOf(category) === -1) {
      return;
    }
    this.currentCategory = category;
    if (!options || !options.silent) {
      this.updateHash();
      this.render();
    }
  };

  proto.nextCategory = function () {
    var categories = this.getCategories();
    var index = categories.indexOf(this.getCurrentCategory());
    if (index < categories.length - 1) {
      this.setCategory(categories[index + 1]);
    }
  };

  proto.previousCategory = function () {
    var categories = this.getCategories();
    var index = categories.indexOf(this.getCurrentCategory());
    if (index > 0) {
      this.setCategory(categories[index - 1]);
    }
  };

  // --- roles & views --------------------------------------------------------

  proto.getRole = function () {
    return this.role;
  };

  proto._defaultVisibility = function () {
    var showNormal = true;
    var showReviewer = true;
    if (this.role === "reviewer") {
      if (this.view === "normal" || this.view === "display") {
        showReviewer = false;
      } else if (this.view === "overview") {
        showNormal = false;
      }
    }
    return { showNormal: showNormal, showReviewer: showReviewer };
  };

  proto.setRole = function (role) {
    if (ROLES.indexOf(role) === -1) {
      return;
    }
    this.role = role;
    // Switching role moves to that role's default view.
    this.view = DEFAULT_VIEW[role];
    this.editingId = null;
    var vis = this._defaultVisibility();
    this.showNormalQuestions = vis.showNormal;
    this.showReviewerQuestions = vis.showReviewer;
    this.updateHash();
    this.triggerChange({ type: "role", value: role });
    this.render();
  };

  proto.getRoleLabels = function () {
    return Object.assign({}, this.roleLabels);
  };

  proto.setRoleLabels = function (labels) {
    this.roleLabels = Object.assign({}, this.roleLabels, labels || {});
    this.render();
  };

  proto.getView = function () {
    return this.view;
  };

  proto.viewAvailable = function (view, role) {
    return (ROLE_VIEWS[role || this.role] || []).indexOf(view) !== -1;
  };

  proto.getAvailableViews = function () {
    return (ROLE_VIEWS[this.role] || []).slice();
  };

  proto.setView = function (view) {
    if (!this.viewAvailable(view, this.role)) {
      return;
    }
    this.view = view;
    var vis = this._defaultVisibility();
    this.showNormalQuestions = vis.showNormal;
    this.showReviewerQuestions = vis.showReviewer;
    this.updateHash();
    this.triggerChange({ type: "view", value: view });
    this.render();
  };

  // --- navigation / hash ----------------------------------------------------

  proto.getAnchor = function () {
    var anchor = this.role + "-" + this.view;
    if (this.view === "template") {
      anchor += "-" + this.selectedTemplateId;
    } else if (this.view === "normal" || this.view === "overview") {
      anchor += "-" + this.getCurrentCategory();
    }
    return anchor;
  };

  proto.setAnchor = function (anchor) {
    this.applyAnchorString(anchor);
  };

  proto.navigateTo = function (target) {
    target = target || {};
    if (target.role && ROLES.indexOf(target.role) !== -1) {
      this.role = target.role;
    }
    if (target.view && this.viewAvailable(target.view, this.role)) {
      this.view = target.view;
    } else if (!this.viewAvailable(this.view, this.role)) {
      this.view = DEFAULT_VIEW[this.role];
    }
    if (target.id) {
      this.resolveAnchorId(target.id);
    }
    this.updateHash();
    this.render();
  };

  proto.resolveAnchorId = function (id) {
    if (!id) {
      return;
    }
    var question = this.getQuestion(id);
    if (question) {
      this.currentCategory = question.category;
      this._pendingScrollId = id;
      return;
    }
    if (this.getCategories().indexOf(id) !== -1) {
      this.currentCategory = id;
      return;
    }
    if (this.view === "template" && TEMPLATE_IDS.indexOf(id) !== -1) {
      this.selectedTemplateId = id;
    }
    // Unknown id: ignored.
  };

  proto.applyAnchorString = function (anchor) {
    var clean = String(anchor || "").replace(/^#/, "");
    if (!clean) {
      return;
    }
    var parts = clean.split("-");
    var role = parts.shift();
    if (ROLES.indexOf(role) === -1) {
      return;
    }
    this.role = role;
    var view = parts.shift();
    if (view === "doc") { view = "display"; }
    if (view && this.viewAvailable(view, role)) {
      this.view = view;
    } else {
      this.view = DEFAULT_VIEW[role];
    }
    var id = parts.join("-");
    if (id) {
      this.resolveAnchorId(id);
    }
  };

  proto.bindHash = function () {
    var self = this;
    if (!W.addEventListener) {
      return;
    }
    W.addEventListener("hashchange", function () {
      if (self._suppressHash) {
        self._suppressHash = false;
        return;
      }
      self.applyHash({ silent: true });
      self.render();
    });
  };

  proto.applyHash = function () {
    if (!W.location) {
      return;
    }
    var hash = W.location.hash || "";
    if (!hash) {
      return;
    }
    this.applyAnchorString(hash);
  };

  proto.updateHash = function () {
    if (!W.location) {
      return;
    }
    var anchor = this.getAnchor();
    var newHash = "#" + anchor;
    if (W.location.hash === newHash) {
      return;
    }
    this._suppressHash = true;
    if (W.history && typeof W.history.pushState === "function" && W.location.protocol !== "file:") {
      try {
        W.history.pushState(null, "", newHash);
        return;
      } catch (error) {
        // fall through to direct assignment
      }
    }
    W.location.hash = anchor;
  };

  proto.navigateToQuestion = function (id) {
    var question = this.getQuestion(id);
    if (!question) {
      return;
    }
    this.currentCategory = question.category;
    this._pendingScrollId = id;
    this.updateHash();
    this.render();
  };

  // --- visibility -----------------------------------------------------------

  // Whether a question is shown for the current role + view, ignoring its
  // conditional visibility expression. Respects showNormalQuestions /
  // showReviewerQuestions flags (reviewer & editor only).
  proto.passesRoleView = function (question) {
    if (question.type === "ignore") {
      return this.showHidden;
    }
    if (question.type === "review") {
      if (this.role === "interviewed") {
        return false;
      }
      if (!this.showReviewerQuestions) {
        return false;
      }
      return true;
    }
    if ((this.role === "reviewer" || this.role === "editor") && !this.showNormalQuestions) {
      return false;
    }
    return true;
  };

  // Whether a question passes its conditional visibility expression. This is
  // independent of role/view filtering so controlling values stay correct.
  proto.isExpressionVisible = function (question, stack) {
    if (!question.visible_if_id) {
      return true;
    }
    stack = stack || [];
    if (stack.indexOf(question.id) !== -1) {
      return true;
    }
    var ref = this.getQuestion(question.visible_if_id);
    if (!ref) {
      return true;
    }
    var refVisible = this.isExpressionVisible(ref, stack.concat(question.id));
    var value = refVisible ? this.questionValue(ref) : ref.default;
    return this.evaluateExpression(question.visible_if_value, value, ref);
  };

  proto.isQuestionVisible = function (question) {
    if (!this.passesRoleView(question)) {
      return false;
    }
    if (!this.isExpressionVisible(question, [])) {
      return this.showHidden;
    }
    return true;
  };

  proto.evaluateExpression = function (expression, value, refQuestion) {
    var expr = String(expression === null || typeof expression === "undefined" ? "" : expression).trim();
    if (expr === "") {
      return value === true || (value !== false && value !== null && typeof value !== "undefined" && value !== "");
    }
    var negate = false;
    if (expr.charAt(0) === "!") {
      negate = true;
      expr = expr.slice(1);
    }
    var tokens = expr.split("|").map(function (token) {
      return token.trim();
    }).filter(function (token) {
      return token !== "";
    });
    var match = tokens.some(function (token) {
      return valueMatchesToken(value, token, refQuestion);
    });
    return negate ? !match : match;
  };

  function valueMatchesToken(value, token, refQuestion) {
    var lowered = token.toLowerCase();
    if (lowered === "true") {
      return boolToken(value) === true;
    }
    if (lowered === "false") {
      return boolToken(value) === false;
    }
    if (lowered === "other") {
      if (value === null || typeof value === "undefined" || value === "") {
        return false;
      }
      if (ciEquals(value, "other")) {
        return true;
      }
      var options = (refQuestion && refQuestion.options) || [];
      var present = options.some(function (option) {
        return ciEquals(value, option.value);
      });
      return !present;
    }
    // Boolean-aware comparison when the token is a boolean word and value is boolean.
    var tokenBool = boolToken(token);
    if (typeof value === "boolean" && tokenBool !== null) {
      return value === tokenBool;
    }
    return ciEquals(value, token);
  }

  // --- rendering ------------------------------------------------------------

  proto.render = function () {
    this.recomputeScores();
    this.getCurrentCategory();
    if (!this.viewAvailable(this.view, this.role)) {
      this.view = DEFAULT_VIEW[this.role];
    }
    this.syncSelects();
    this.syncHeaderControls();
    this.renderHeader();
    this.renderFooter();
    this.renderCategoryNav();

    var containers = this.containers;
    if (this.view === "overview") {
      this.renderSummary();
    } else if (containers.summary) {
      containers.summary.innerHTML = "";
    }

    if (this.view === "tabular") {
      if (containers.questions) {
        containers.questions.innerHTML = "";
      }
      this.renderTabular();
    } else if (this.view === "template") {
      if (containers.questions) {
        containers.questions.innerHTML = "";
      }
      this.renderTemplateEditor();
    } else if (this.view === "display") {
      this.renderDisplay();
      if (containers.editor) {
        containers.editor.innerHTML = "";
      }
    } else {
      this.renderQuestions();
      this.renderEditorPanel();
    }

    this.flushPendingScroll();
  };

  proto.syncSelects = function () {
    var doc = W.document;
    if (!doc) {
      return;
    }
    var self = this;
    var roleSelect = doc.getElementById("role-select");
    if (roleSelect) {
      roleSelect.innerHTML = ROLES.map(function (role) {
        return '<option value="' + escapeHtml(role) + '">' + escapeHtml(self.roleLabels[role]) + "</option>";
      }).join("");
      roleSelect.value = this.role;
    }
    var viewSelect = doc.getElementById("view-select");
    if (viewSelect) {
      viewSelect.innerHTML = this.getAvailableViews().map(function (view) {
        return '<option value="' + escapeHtml(view) + '">' + escapeHtml(self.viewLabels[view]) + "</option>";
      }).join("");
      viewSelect.value = this.view;
    }
    var viewModes = doc.getElementById("view-menu-modes");
    if (viewModes) {
      viewModes.innerHTML = this.getAvailableViews().map(function (view) {
        var active = view === self.view ? " is-active" : "";
        return '<button type="button" class="q-menu-item q-view-mode-btn' + active +
          '" data-view-mode="' + escapeHtml(view) + '">' +
          escapeHtml(self.viewLabels[view]) + "</button>";
      }).join("");
      viewModes.querySelectorAll("[data-view-mode]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          self.setView(btn.getAttribute("data-view-mode"));
        });
      });
    }
    // Visibility checkboxes — only shown in reviewer/editor roles.
    var normalCb = doc.getElementById("show-normal-checkbox");
    if (normalCb) {
      normalCb.checked = this.showNormalQuestions;
      if (!normalCb._qBound) {
        normalCb._qBound = true;
        normalCb.addEventListener("change", function () {
          self.showNormalQuestions = normalCb.checked;
          self.render();
        });
      }
    }
    var reviewerCb = doc.getElementById("show-reviewer-checkbox");
    if (reviewerCb) {
      reviewerCb.checked = this.showReviewerQuestions;
      if (!reviewerCb._qBound) {
        reviewerCb._qBound = true;
        reviewerCb.addEventListener("change", function () {
          self.showReviewerQuestions = reviewerCb.checked;
          self.render();
        });
      }
    }
    var hiddenCb = doc.getElementById("show-hidden-checkbox");
    if (hiddenCb) {
      hiddenCb.checked = this.showHidden;
      if (!hiddenCb._qBound) {
        hiddenCb._qBound = true;
        hiddenCb.addEventListener("change", function () {
          self.showHidden = hiddenCb.checked;
          self.render();
        });
      }
    }
  };

  proto.syncHeaderControls = function () {
    var doc = W.document;
    if (!doc) {
      return;
    }
    var self = this;
    doc.querySelectorAll("[data-roles]").forEach(function (el) {
      var roles = el.getAttribute("data-roles").split(/\s+/).filter(Boolean);
      el.hidden = roles.indexOf(self.role) === -1;
    });
    var shell = doc.querySelector(".q-shell");
    if (shell) {
      shell.classList.toggle("is-fullwidth", this.role === "editor");
    }
  };

  proto.renderCategoryNav = function () {
    var container = this.containers.categoryNav;
    if (!container) {
      return;
    }
    var categories = this.getCategories();
    if (categories.length <= 1 || this.view === "tabular" || this.view === "template" || this.view === "display") {
      container.innerHTML = "";
      container.hidden = true;
      return;
    }
    container.hidden = false;
    var self = this;
    container.innerHTML = categories.map(function (category) {
      var current = category === self.currentCategory ? " is-current" : "";
      return '<button type="button" class="q-category-tab' + current + '" data-category="' +
        escapeHtml(category) + '">' + escapeHtml(category) + "</button>";
    }).join("");
    container.querySelectorAll("[data-category]").forEach(function (button) {
      button.addEventListener("click", function () {
        self.setCategory(button.getAttribute("data-category"));
      });
    });
  };

  proto.renderSummary = function () {
    var container = this.containers.summary;
    if (!container) {
      return;
    }
    var score = this.getScore();
    container.innerHTML = '<div class="q-summary-panel">' +
      this.renderSummaryBlock(this.getCurrentCategory(), score.current_category) +
      this.renderSummaryBlock(this.totalLabel, score.total) +
      "</div>";
  };

  proto.renderSummaryBlock = function (label, summary) {
    var self = this;
    var rag = this.ragClass(summary.score);
    var ragClass = rag ? " q-rag-" + rag : "";
    var scoreText = summary.score === null ? "–" : (Math.round(summary.score * 10) / 10) + "%";
    var counts = REVIEW_STATUSES.map(function (status) {
      return '<span class="q-summary-count q-status-' + status + '">' +
        escapeHtml(self.statusLabels[status]) + ": " + summary.counts[status] + "</span>";
    }).join("");
    return '<div class="q-summary-block' + ragClass + '">' +
      '<div class="q-summary-label">' + escapeHtml(label) + "</div>" +
      '<div class="q-summary-counts">' + counts + "</div>" +
      '<div class="q-summary-score">' + escapeHtml(scoreText) + "</div>" +
      '<div class="q-summary-total"><strong>' + summary.total + "</strong> review question(s)</div>" +
      "</div>";
  };

  proto.renderDisplay = function () {
    var container = this.containers.questions;
    if (!container) { return; }
    var self = this;
    var categories = this.getCategories();
    var displayCardTpl = this.getTemplateBody("display_card");
    var displayReviewerTpl = this.getTemplateBody("display_reviewer_card");
    var html = '<div class="q-display">';
    categories.forEach(function (cat) {
      html += '<h2 class="q-display-category">' + escapeHtml(cat) + "</h2>";
      self.questions.forEach(function (question) {
        if (question.category !== cat) { return; }
        if (!self.passesRoleView(question)) { return; }
        if (!self.isQuestionVisible(question)) { return; }
        if (!self.editorQuestionMatchesSearch(question, self.editorSearch)) { return; }
        var ctx = self.questionContext(question);
        var tpl = question.type === "review" ? displayReviewerTpl : displayCardTpl;
        var rendered = W.Mustache ? W.Mustache.render(tpl, ctx) : tpl;
        if (ctx._hidden_revealed) {
          html += '<div class="q-display-hidden">' + rendered + '</div>';
        } else {
          html += rendered;
        }
      });
    });
    html += "</div>";
    container.innerHTML = html;
    if (this.containers.editor) { this.containers.editor.innerHTML = ""; }
  };

  proto.renderHeader = function () {
    var container = this.containers.header;
    if (!container) { return; }
    var doc = W.document;
    var hadSearchFocus = doc && doc.activeElement &&
      doc.activeElement.getAttribute && doc.activeElement.getAttribute("data-global-search") !== null;
    var tpl = this.getTemplateBody("header");
    var ctx = {
      title: this.config.title || "",
      version: this.config.version || "",
      id: this.config.id || "",
      _role: this.role,
      _view: this.view,
      _lib_version: LIB_VERSION
    };
    container.innerHTML = W.Mustache ? W.Mustache.render(tpl, ctx) : tpl;
    this.bindHeader(container);
    var searchEl = container.querySelector("[data-global-search]");
    if (searchEl) {
      searchEl.value = this.editorSearch || "";
      if (hadSearchFocus) {
        searchEl.focus();
        searchEl.setSelectionRange(searchEl.value.length, searchEl.value.length);
      }
    }
  };

  proto.renderFooter = function () {
    var container = this.containers.footer;
    if (!container) { return; }
    if (this.view === "template" || this.view === "display") {
      container.hidden = true;
      return;
    }
    container.hidden = false;
    var tpl = this.getTemplateBody("footer");
    var ctx = {
      title: this.config.title || "",
      version: this.config.version || "",
      id: this.config.id || "",
      _role: this.role,
      _view: this.view,
      _lib_version: LIB_VERSION
    };
    container.innerHTML = W.Mustache ? W.Mustache.render(tpl, ctx) : tpl;
    this.bindHeader(container);
  };

  proto.bindHeader = function (container) {
    var self = this;
    var doc = W.document;
    // Role select
    var roleSelect = container.querySelector("#role-select") || (doc && doc.getElementById("role-select"));
    if (roleSelect && !roleSelect._qBound) {
      roleSelect._qBound = true;
      roleSelect.addEventListener("change", function () {
        self.setRole(roleSelect.value);
      });
    }
    // View select
    var viewSelect = container.querySelector("#view-select") || (doc && doc.getElementById("view-select"));
    if (viewSelect && !viewSelect._qBound) {
      viewSelect._qBound = true;
      viewSelect.addEventListener("change", function () {
        self.setView(viewSelect.value);
      });
    }
    // Prev/Next
    var prev = container.querySelector("#prev-category") || (doc && doc.getElementById("prev-category"));
    if (prev && !prev._qBound) {
      prev._qBound = true;
      prev.addEventListener("click", function () { self.previousCategory(); });
    }
    var next = container.querySelector("#next-category") || (doc && doc.getElementById("next-category"));
    if (next && !next._qBound) {
      next._qBound = true;
      next.addEventListener("click", function () { self.nextCategory(); });
    }
    // Save/Load
    var saveHtml = container.querySelector("#save-html") || (doc && doc.getElementById("save-html"));
    if (saveHtml && !saveHtml._qBound) {
      saveHtml._qBound = true;
      saveHtml.addEventListener("click", function () { self.saveHtmlFile(); });
    }
    var saveCsv = container.querySelector("#save-csv") || (doc && doc.getElementById("save-csv"));
    if (saveCsv && !saveCsv._qBound) {
      saveCsv._qBound = true;
      saveCsv.addEventListener("click", function () { self.saveCsvFile(); });
    }
    var saveJson = container.querySelector("#save-json") || (doc && doc.getElementById("save-json"));
    if (saveJson && !saveJson._qBound) {
      saveJson._qBound = true;
      saveJson.addEventListener("click", function () { self.saveJsonFile(); });
    }
    var loadCsv = container.querySelector("#load-csv") || (doc && doc.getElementById("load-csv"));
    if (loadCsv && !loadCsv._qBound) {
      loadCsv._qBound = true;
      loadCsv.addEventListener("change", function () {
        var file = loadCsv.files && loadCsv.files[0];
        if (!file) { return; }
        file.text().then(function (text) { self.loadCsv(text); });
      });
    }
    // Save shortcut
    var saveShortcut = container.querySelector("#save-html-shortcut");
    if (saveShortcut && !saveShortcut._qBound) {
      saveShortcut._qBound = true;
      saveShortcut.addEventListener("click", function () { self.saveHtmlFile(); });
    }
    // Menu open/close
    container.querySelectorAll(".q-menu-trigger").forEach(function (trigger) {
      if (trigger._qBound) { return; }
      trigger._qBound = true;
      trigger.addEventListener("click", function (e) {
        var menu = trigger.closest(".q-menu");
        var wasOpen = menu.classList.contains("is-open");
        container.querySelectorAll(".q-menu.is-open").forEach(function (m) {
          m.classList.remove("is-open");
        });
        if (!wasOpen) { menu.classList.add("is-open"); }
        e.stopPropagation();
      });
    });
    if (!container._qMenuClose) {
      container._qMenuClose = true;
      doc.addEventListener("click", function () {
        container.querySelectorAll(".q-menu.is-open").forEach(function (m) {
          m.classList.remove("is-open");
        });
      });
    }
    // Help dialogs
    var descBtn = container.querySelector("[data-help-description]");
    if (descBtn && !descBtn._qBound) {
      descBtn._qBound = true;
      descBtn.addEventListener("click", function () { self.showDescriptionDialog(); });
    }
    var aboutBtn = container.querySelector("[data-help-about]");
    if (aboutBtn && !aboutBtn._qBound) {
      aboutBtn._qBound = true;
      aboutBtn.addEventListener("click", function () { self.showAboutDialog(); });
    }
    // Global search
    var globalSearch = container.querySelector("[data-global-search]");
    if (globalSearch) {
      globalSearch.value = self.editorSearch || "";
      if (!globalSearch._qBound) {
        globalSearch._qBound = true;
        globalSearch.addEventListener("input", function () {
          self.editorSearch = globalSearch.value;
          self.render();
        });
      }
    }
    this.syncHeaderControls();
    this.syncSelects();
  };

  proto.currentQuestions = function () {
    var self = this;
    return this.questions.filter(function (question) {
      return question.category === self.getCurrentCategory();
    });
  };

  proto.renderQuestions = function () {
    var container = this.containers.questions;
    if (!container) {
      return;
    }
    var self = this;
    var visible = this.currentQuestions().filter(function (question) {
      return self.isQuestionVisible(question) &&
        self.editorQuestionMatchesSearch(question, self.editorSearch);
    });
    if (!visible.length) {
      container.innerHTML = '<p class="q-empty">No questions to display.</p>';
      return;
    }
    container.innerHTML = visible.map(function (question) {
      return self.renderQuestion(question);
    }).join("");
    this.bindQuestionControls(container);
  };

  proto.pickCardTemplate = function (question) {
    var isReviewCard = question.type === "review" && (this.role === "reviewer" || this.role === "editor");
    if (isReviewCard) {
      var reviewerTemplate = this.getTemplateBody("reviewer_card");
      return reviewerTemplate || this.getTemplateBody("question_card");
    }
    return this.getTemplateBody("question_card");
  };

  function answerDisplay(value) {
    if (value === null || typeof value === "undefined") { return ""; }
    if (value === true) { return "Yes"; }
    if (value === false) { return "No"; }
    return String(value);
  }

  proto.questionContext = function (question) {
    var context = deepClone(question);
    context._role = this.role;
    context._view = this.view;
    context._editor = this.role === "editor";
    context._reviewer = this.role === "reviewer";
    context._interviewed = this.role === "interviewed";
    context._visible = this.isQuestionVisible(question);
    context._is_review = question.type === "review";
    context._category_title = question.category;
    context._status_label = this.statusLabels[question.review_status] || question.review_status;
    context._analysis_visible = (this.role === "reviewer" || this.role === "editor") && !!question.analysis;
    context._comment_readonly = this.role === "interviewed" && !!question.reviewer_comment;
    context._has_comment = !!question.reviewer_comment;
    context._highlight_reviewer = question.type === "review" && this.showNormalQuestions && this.showReviewerQuestions;
    context._answer_display = answerDisplay(question.answer);
    var errors = this.validationErrors[question.id];
    context._errors = errors ? [errors] : [];
    var rag = this.ragClass(null);
    context._rag = rag;
    context._lib_version = LIB_VERSION;
    var wouldBeHidden = question.type === "ignore" || !this.isExpressionVisible(question, []);
    context._hidden_revealed = wouldBeHidden && this.showHidden;
    return context;
  };

  proto.renderQuestion = function (question) {
    var template = this.pickCardTemplate(question);
    var doc = W.document;
    var wrapper = doc.createElement("div");
    wrapper.innerHTML = renderTemplate(template, this.questionContext(question)).trim();
    var node = wrapper.firstElementChild;
    if (!node) {
      return "";
    }
    if (!node.getAttribute("data-question-id")) {
      node.setAttribute("data-question-id", question.id);
    }
    var control = node.querySelector("[data-question-control]");
    if (control) {
      control.innerHTML = this.renderQuestionControl(question);
    }
    var review = node.querySelector("[data-review-control]");
    if (review) {
      review.innerHTML = this.renderReviewControl(question);
    }
    var comment = node.querySelector("[data-reviewer-comment-control]");
    if (comment) {
      comment.innerHTML = this.renderCommentControl(question);
    }
    var wouldBeHidden = question.type === "ignore" || !this.isExpressionVisible(question, []);
    if (wouldBeHidden && this.showHidden) {
      node.classList.add("q-hidden-revealed");
    }
    return node.outerHTML;
  };

  proto.answerDisabled = function (question) {
    if (this.role === "reviewer" && question.type !== "review") {
      return true;
    }
    return false;
  };

  proto.renderQuestionControl = function (question) {
    var value = this.questionValue(question);
    var disabled = this.answerDisabled(question) ? " disabled" : "";
    var id = escapeHtml(question.id);

    if (question.type === "info") {
      return '<pre class="q-info">' + escapeHtml(value || "") + "</pre>";
    }
    if (question.type === "html") {
      return '<div class="q-html">' + String(value || "") + "</div>";
    }
    if (question.type === "checkbox") {
      var checked = boolToken(value) === true ? " checked" : "";
      var label = (question.options[0] && question.options[0].label) || "Yes";
      return '<label class="q-choice"><input type="checkbox" data-answer="' + id + '"' + checked + disabled +
